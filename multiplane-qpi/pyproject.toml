[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mpqpi"
version = "0.1.0"
description = "Multiplane microscope calibration and 3D quantitative phase imaging after Descloux et al., Nat. Photonics 12, 165 (2018)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "scikit-image>=0.19", "tifffile>=2021.7", "matplotlib>=3.5", "h5py>=3.6", "pyyaml>=6", "nbformat>=5"]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
